syntax = "proto3";

package mpc.grpc;

// Servicio principal MPC gRPC
service MPCService {
  // Envío de mensaje unidireccional
  rpc SendMessage(MessageRequest) returns (MessageResponse);
  
  // Streaming unidireccional del servidor
  rpc StreamMessages(StreamRequest) returns (stream MessageEvent);
  
  // Streaming bidireccional
  rpc BidirectionalStream(stream MessageRequest) returns (stream MessageEvent);
  
  // Obtener estadísticas del servidor
  rpc GetStats(StatsRequest) returns (StatsResponse);
  
  // Health check
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// Tipos de mensaje
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_REQUEST = 1;
  MESSAGE_TYPE_RESPONSE = 2;
  MESSAGE_TYPE_EVENT = 3;
  MESSAGE_TYPE_ERROR = 4;
}

// Tipos de protocolo
enum ProtocolType {
  PROTOCOL_TYPE_UNSPECIFIED = 0;
  PROTOCOL_TYPE_HTTP = 1;
  PROTOCOL_TYPE_WEBSOCKET = 2;
  PROTOCOL_TYPE_GRPC = 3;
  PROTOCOL_TYPE_MCP = 4;
}

// Mensaje principal
message MessageRequest {
  string id = 1;
  MessageType type = 2;
  ProtocolType protocol = 3;
  string payload = 4;  // JSON serializado
  map<string, string> metadata = 5;
  double timestamp = 6;
  string source = 7;
  string destination = 8;
  string correlation_id = 9;
}

// Respuesta de mensaje
message MessageResponse {
  bool success = 1;
  string message = 2;
  string request_id = 3;
  double timestamp = 4;
  map<string, string> metadata = 5;
}

// Evento de mensaje (para streaming)
message MessageEvent {
  string id = 1;
  MessageType type = 2;
  ProtocolType protocol = 3;
  string payload = 4;
  map<string, string> metadata = 5;
  double timestamp = 6;
  string source = 7;
  string correlation_id = 8;
}

// Solicitud de streaming
message StreamRequest {
  repeated string message_types = 1;  // Filtrar por tipos de mensaje
  repeated string sources = 2;        // Filtrar por fuentes
  map<string, string> filters = 3;    // Filtros adicionales
  int32 buffer_size = 4;              // Tamaño del buffer
}

// Solicitud de estadísticas
message StatsRequest {
  bool include_connections = 1;
  bool include_performance = 2;
  bool include_errors = 3;
}

// Respuesta de estadísticas
message StatsResponse {
  ServerStats server_stats = 1;
  repeated ProtocolStats protocol_stats = 2;
  PerformanceStats performance_stats = 3;
  repeated ErrorStats error_stats = 4;
}

// Estadísticas del servidor
message ServerStats {
  string server_id = 1;
  double uptime_seconds = 2;
  int64 total_messages = 3;
  int64 active_connections = 4;
  string version = 5;
  double timestamp = 6;
}

// Estadísticas por protocolo
message ProtocolStats {
  ProtocolType protocol = 1;
  int64 total_connections = 2;
  int64 active_connections = 3;
  int64 messages_sent = 4;
  int64 messages_received = 5;
  double avg_response_time = 6;
}

// Estadísticas de rendimiento
message PerformanceStats {
  double cpu_usage = 1;
  double memory_usage = 2;
  int64 messages_per_second = 3;
  double avg_latency_ms = 4;
  int64 error_rate = 5;
}

// Estadísticas de errores
message ErrorStats {
  string error_type = 1;
  int64 count = 2;
  double last_occurrence = 3;
  string description = 4;
}

// Health check
message HealthRequest {
  string service = 1;
}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SERVING = 1;
    STATUS_NOT_SERVING = 2;
    STATUS_SERVICE_UNKNOWN = 3;
  }
  
  Status status = 1;
  string message = 2;
  double timestamp = 3;
  map<string, string> details = 4;
}